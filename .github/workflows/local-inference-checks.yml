name: Local inference adapter checks
on:
  push:
  pull_request:
jobs:
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python scripts and shell syntax
        run: |
          python3 -m py_compile workers/qwen_worker.py scripts/probe-geniex.py workers/laya_worker.py workers/ssa_pdf_worker.py scripts/ssa3368-field-workbench.py
          bash -n scripts/launch-wsl.sh scripts/prepare-ssa16-template.sh scripts/prepare-ssa3368-template.sh
      - name: Test routing without network or model downloads
        run: python3 -m unittest discover -s workers -p 'test_qwen_worker.py' -v
