name: Native Tauri compile and vault tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  linux-native-tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Tauri 2 native Linux development dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Check native Tauri bridge, including synthetic vault commands
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
      - name: Test native vault file handling
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
