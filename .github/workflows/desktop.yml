name: Desktop checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Windows WSL launcher syntax
        run: bash -n ../../scripts/launch-wsl.sh ../../scripts/launch-wsl-cuda.sh
      - run: npm install --no-audit --no-fund
      - run: npm run test:forms
      - run: npm run test:unified
      - run: npm run test:submissions
      - run: npm run test:workflow
      - run: npm run test:fields
      - run: npm run test:intake
      - run: npm run test:evidence
      - run: npm run test:auth
      - run: npm run test:package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf>=1.24,<1.27'
      - run: python -m unittest discover -s ../../workers -p test_ssa_pdf_worker.py
      - run: python -m unittest discover -s ../../workers -p test_audit_ssa_source_forms.py
      - run: npm run build
