[package]
name = "soar-desk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "Native Windows Rust/Slint SOAR Desk application"

[dependencies]
slint = { version = "=1.8.0", default-features = false, features = ["std", "backend-winit", "renderer-femtovg"] }
soar-native-store = { path = "../../crates/soar-native-store" }
serde_json = "1"
rfd = "0.15"
dirs = "5"
lopdf = "0.34"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"

[build-dependencies]
slint-build = "=1.8.0"
