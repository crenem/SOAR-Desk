[package]
name = "soar-desk-desktop"
version = "0.1.0"
description = "SOAR Desk community desktop prototype"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "soar_desk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
soar-core = { path = "../../../crates/soar-core" }

soar-documents = { path = "../../../crates/soar-documents" }
serde_json = "1"
